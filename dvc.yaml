stages:
  prepare:
    cmd: python src/prepare.py
    deps:
    - src/prepare.py
    outs:
    - data/raw/fashion_mnist.npz
  preprocess:
    cmd: python src/preprocess.py
    deps:
    - data/raw/fashion_mnist.npz
    - src/preprocess.py
    params:
    - preprocess.seed
    - preprocess.test_size
    outs:
    - data/processed/test.npz
    - data/processed/train.npz
    - data/processed/val.npz
  train:
    cmd: python src/train.py
    deps:
    - data/processed/train.npz
    - data/processed/val.npz
    - src/train.py
    params:
    - train.batch_size
    - train.dense_units
    - train.dropout_rate
    - train.epochs
    - train.learning_rate
    outs:
    - models/history.csv
    - models/model.h5
  evaluate:
    cmd: python src/evaluate.py
    deps:
    - data/processed/test.npz
    - models/model.h5
    - src/evaluate.py
    metrics:
    - metrics.json:
        cache: false
    plots:
    - confusion_matrix.png
